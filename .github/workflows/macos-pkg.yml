name: Build macOS PKG

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-pkg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run desktop:typecheck
      - run: pnpm run test
      - run: pnpm run desktop:package:mac
      - uses: actions/upload-artifact@v7
        with:
          name: FaceGuard-macOS-arm64-PKG
          path: out/FaceGuard-*-arm64.pkg
          if-no-files-found: error
