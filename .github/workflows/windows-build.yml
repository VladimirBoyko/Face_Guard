name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run desktop:typecheck
      - run: pnpm run test
      - run: pnpm run desktop:make:windows
      - name: Verify the Start menu shortcut after one install
        shell: pwsh
        run: ./installer/test-windows-install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: FaceGuard-Windows-x64
          path: |
            out/make/squirrel.windows/x64/FaceGuard-Setup.exe
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/*.nupkg
          if-no-files-found: error
